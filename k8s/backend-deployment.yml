apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend 
  namespace: devboard
  labels:
    app: backend-label

spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-label
  template:
    metadata:
      labels:
        app: backend-label
    spec:

      containers:
        - name: devboard-frontend
          image: chaitanya057/devboard-backend:latest
          ports:
            - containerPort: 8080

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRESS_DB
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRES_DB

      

            - name: POSTGRES_URL
              value: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

            - name: PORT
              value: "8080" 
