apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment 
  namespace: devboard
  labels:
    app: postgres-label

spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-label
  template:
    metadata:
      labels:
        app: postgres-label
    spec:

      containers:
        - name: devboard-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRESS_DB
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRES_DB


      volumes:
        - name: init
          configMap:
            name: postgres-init

                              



