apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-label

spec:
  replicas: 6
  selector:
    matchLabels:
      app: devboard-label
  template:
    metadata:
      labels:
        app: devboard-label
    spec:

      containers:
        - name: devboard-frontend
          image: chaitanya057/devboard-frontend:latest
          ports:
            - containerPort: 4173

        
