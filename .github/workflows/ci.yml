name: ci workflow

on:
  push:
    branches: [advanced]
    paths: 
     - 'frontend/**'


jobs:
  frontend:
    
    runs-on: ubutnu-latest

    steps:
      
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: setup Node.js
        uses: actions/setup-node@v6
        with: 
          node_version: "v26"
          cache: npm
          check-latest: false

      - name: install package
        run: npm ci 

      - name: Run Linter
        run: npm run Linter


      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/Dockerfile
          push: true
          tags:  ${{ vars.DOCKERHUB_USERNAME }}/devboard-forntend:latestgit