name: code_quality

on:
  
  workflow_call:
    

jobs:

  sast:

   runs-on: ubuntu-latest

   steps:
     - name: checkout code
       uses: actions/checkout@v7

     - name: setup Node.js
       uses: actions/setup-node@v6
       with: 
          node-version: '26'
          cache: npm
          cache-dependency-path: './frontend/package-lock.json'

          check-latest: false

     - name: install package
       run: npm ci 
       working-directory: ./frontend

     - name: Run Linter
       run: npm run lint
       working-directory: ./frontend

     - name: Setup Go #backend
       uses: actions/setup-go@v6
       with: 
          go-version: '1.23'
          go-version-file: 'go.mod'
          cache: true
          check-latest: false
          cache-dependency-path: 'go.sum'

     - name: formating go code
       run: go fmt
       working-directory: backend

     - name: test cases
       run: go test
       working-directory: backend


     - name: Run go vet
       run: go vet
       working-directory: backend



  