name: sonar_Quebe

on:
 workflow_call:
   
jobs:
  
  Sonar_Qube_scan:

    runs-on: ubuntu-latest

    steps:


     - name: Checkout code
       uses: actions/checkout@v6


     - name: SonarQube Scan
       uses: SonarSource/sonarqube-scan-action@v5 
       env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}