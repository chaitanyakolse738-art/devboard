name: dokcer push

on:
 workflow_call:
   
jobs:
  
  docker_push:

   runs-on: ubuntu-latest
   strategy:
    fail-fast: false
    matrix:
        # Define your keys and an array of values for each
        folders: [frontend, backend]
   steps:
    - name: checkout code
      uses: actions/checkout@v6



    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build the image and push it to the registry
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        contest: ${{ matrix.folders }}
        push: true
        tags:  ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest 


    