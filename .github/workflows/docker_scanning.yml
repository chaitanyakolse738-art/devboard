name: docker_scanning

on:
 workflow_call:
   
jobs:
  
 docker_scan:

  runs-on: ubuntu-latest
  strategy:
            fail-fast: false
            matrix: 
                folders: ['frontend', 'backend']

  steps:

   - name: checkout code
     uses: actions/checkout@v7

   - name: ${{ matrix.folders }} Linter
     uses: hadolint/hadolint-action@v3.1.0
     with:
      dockerfile: ${{ matrix.folders }}/Dockerfile
