name: docker_scanning

on:
 workflow_call:
   
jobs:
  
 docker_scan:

  runs-on: ubuntu-latest
  strategy:
            fail-fast: false
            matrix: 
                folders: ['frontend', 'backend']

  steps:

   - name: checkout code
     uses: actions/checkout@v7

   - name: ${{ matrix.folders }} Linter
     uses: hadolint/hadolint-action@v3.1.0
     with:
      dockerfile: ${{ matrix.folders }}/Dockerfile


   - name: Login to Docker Hub
     uses: docker/login-action@v4
     with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        

   - name: Docker build
     run: docker build -t  ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders}}:latest .
     working-directory: ${{ matrix.folders }}

   - name: Run Trivy vulnerability scanner
     uses: aquasecurity/trivy-action@master
     continue-on-error: true
     with:
        image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders}}:latest 
        format: 'table'
        exit-code: '1' # Fails the pipeline if vulnerabilities match criteria
        ignore-unfixed: true
        severity: 'HIGH,CRITICAL'