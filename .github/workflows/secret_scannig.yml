name: scecret_scanning

on:
  workflow_call:
    
jobs:
  
  secret_scan:

    runs-on: ubuntu-latest

    steps:

     - name: code_checkout
       uses: actions/checkout@v7
       with:
          fetch-depth: 0 

     - name: Run Gitleaks
       uses: gitleaks/gitleaks-action@v2
       env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}